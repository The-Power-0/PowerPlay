// Inspect the immutable release app's actual releaseRuntimeClasspath artifacts.
// This script is an auditor-only init script and does not change the shipped app.
import groovy.json.JsonOutput

gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) {
        // Flutter plugin-loader included builds have their own root, with no :app.
        return
    }
    app.tasks.register('exportReleaseRuntimeArtifacts') {
        group = 'verification'
        description = 'Export resolved AAR/JAR paths for binary license evidence'
        doLast {
            def outputPath = System.getenv('AUDIT_RUNTIME_ARTIFACTS_OUTPUT')
            if (!outputPath) {
                throw new GradleException('Set AUDIT_RUNTIME_ARTIFACTS_OUTPUT to a JSON output path')
            }
            def cfg = app.configurations.getByName('releaseRuntimeClasspath')
            // Android project libraries offer many derived artifact variants.
            // A type-free artifactView is ambiguous under Gradle 9/AGP 9. Pin a
            // raw Maven binary type and limit the view to EXTERNAL modules.
            // Flutter/local project-native outputs are inventoried separately.
            def rowsByFile = [:]
            def typeAttr = org.gradle.api.attributes.Attribute.of('artifactType', String)
            for (String type : ['aar', 'jar']) {
                def view = cfg.incoming.artifactView {
                    lenient(true)
                    componentFilter { id ->
                        id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
                    }
                    attributes {
                        attribute(typeAttr, type)
                    }
                }
                def failures = view.artifacts.failures
                if (!failures.empty) {
                    println "Audit artifact type ${type}: ${failures.size()} lenient failures; these must be separately reconciled"
                }
                for (def artifact : view.artifacts.artifacts) {
                    if (!(artifact.file.name.endsWith('.aar') || artifact.file.name.endsWith('.jar'))) {
                        continue
                    }
                    def key = artifact.id.componentIdentifier.displayName + ':' + artifact.file.absolutePath
                    rowsByFile[key] = [
                        coordinate: artifact.id.componentIdentifier.displayName,
                        name: artifact.file.name,
                        path: artifact.file.absolutePath,
                        component_type: artifact.id.componentIdentifier.class.simpleName,
                        variant: artifact.variant.displayName
                    ]
                }
            }
            def rows = rowsByFile.values().toList().sort { a, b ->
                (a.coordinate + '/' + a.name) <=> (b.coordinate + '/' + b.name)
            }
            if (rows.empty) {
                throw new GradleException('External runtime AAR/JAR export yielded no artifacts')
            }
            def out = new File(outputPath)
            out.parentFile.mkdirs()
            out.text = JsonOutput.prettyPrint(JsonOutput.toJson(rows)) + '\n'
            println "Exported ${rows.size()} resolved runtime artifacts to ${out.absolutePath}"
        }
    }
}
