// Inspect the immutable release app's actual releaseRuntimeClasspath artifacts.
// This script is an auditor-only init script and does not change the shipped app.
import groovy.json.JsonOutput

gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) {
        // Flutter plugin-loader included builds have their own root, with no :app.
        return
    }
    app.tasks.register('exportReleaseRuntimeArtifacts') {
        group = 'verification'
        description = 'Export resolved AAR/JAR paths for binary license evidence'
        doLast {
            def outputPath = System.getenv('AUDIT_RUNTIME_ARTIFACTS_OUTPUT')
            if (!outputPath) {
                throw new GradleException('Set AUDIT_RUNTIME_ARTIFACTS_OUTPUT to a JSON output path')
            }
            def cfg = app.configurations.getByName('releaseRuntimeClasspath')
            def artifacts = cfg.incoming.artifactView { }.artifacts.artifacts
            def rows = artifacts.collect { artifact ->
                [
                    coordinate: artifact.id.componentIdentifier.displayName,
                    name: artifact.file.name,
                    path: artifact.file.absolutePath,
                    component_type: artifact.id.componentIdentifier.class.simpleName,
                    variant: artifact.variant.displayName
                ]
            }.sort { a, b -> (a.coordinate + '/' + a.name) <=> (b.coordinate + '/' + b.name) }
            def out = new File(outputPath)
            out.parentFile.mkdirs()
            out.text = JsonOutput.prettyPrint(JsonOutput.toJson(rows)) + '\n'
            println "Exported ${rows.size()} resolved runtime artifacts to ${out.absolutePath}"
        }
    }
}
