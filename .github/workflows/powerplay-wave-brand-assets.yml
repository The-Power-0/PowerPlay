name: Stage Wave + Circuit PowerPlay assets (review branch only)
on:
  push:
    branches:
      - 'branding/wave-circuit-production-assets'
    paths:
      - 'assets/brand/powerplay-mark.svg'
      - 'assets/brand/powerplay-mark-flat.svg'
      - 'assets/brand/powerplay-mark-monochrome.svg'
      - 'assets/brand/powerplay-app-icon.svg'
      - 'scripts/branding/render_production_assets.py'
      - 'scripts/branding/refresh_alternate_icons.py'
      - '.github/workflows/powerplay-wave-brand-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    if: github.ref == 'refs/heads/branding/wave-circuit-production-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install reproducible renderers
        run: |
          python -m pip install 'cairosvg>=2.7,<3' 'Pillow>=11,<13'
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin imagemagick webp
          if ! command -v magick >/dev/null; then sudo ln -s "$(command -v convert)" /usr/local/bin/magick; fi
      - name: Build default launcher, splash, README and platform icons
        run: python scripts/branding/render_production_assets.py
      - name: Rebuild 23 existing selectable themes with the new glyph
        run: |
          python scripts/branding/refresh_alternate_icons.py
          python scripts/codegen/generate_app_icons.py
      - name: Validate generated assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import xml.etree.ElementTree as ET
          import hashlib
          approved=Path('assets/brand/powerplay-mark.svg').read_bytes()
          assert hashlib.sha256(approved).hexdigest() == 'ec899293036bf7e8ce096894c529928c231a3d2e7b7fe804b2f51a1d3d8bb3dc', 'approved v10 SVG changed'
          for p in Path('assets/brand').glob('*.svg'): ET.parse(p)
          assert Path('docs/artwork/powerplay-icon.svg').read_bytes()==approved
          for name in ('powerplay-mark-flat.svg','powerplay-mark-monochrome.svg'):
              assert (Path('assets/brand')/name).read_bytes()==approved
          for p in Path('assets/app_icons/source').glob('*/foreground.svg'):
              assert 'frameDiagonal' in p.read_text() and 'pcbStroke' in p.read_text(), p
          for p in ('android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png',
                    'android/app/src/main/res/drawable-xhdpi/tv_banner.png',
                    'docs/artwork/powerplay-banner.webp',
                    'website/static/og/powerplay-social.png'):
              with Image.open(p) as im: im.verify()
          folders=list(Path('assets/app_icons/source').glob('*/foreground.svg'))
          assert len(folders)==23, len(folders)
          print('Brand QA: SVG syntax, launcher, TV banner, README art, website image, and 23 themes validated')
          PY
      - name: Commit generated artifacts to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/app_icons assets/brand docs/artwork android/app/src/main/res ios/Runner/AlternateAppIcons.xcassets tvos/Runner/AlternateAppIcons.xcassets tvos/Runner/Assets.xcassets windows/runner/resources website/static/og
          git add assets/plezy.svg assets/plezy.png assets/plezy_adaptive_foreground.svg assets/powerplay.png assets/powerplay_splash.png
          git add android/app/src/main/AndroidManifest.xml tvos/Runner/Info.plist
          if ! git diff --cached --quiet; then
            git commit -m "brand: render Wave + Circuit production launcher and documentation assets"
            git push origin HEAD:branding/wave-circuit-production-assets
          fi
