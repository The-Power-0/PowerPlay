name: Stage fully rebranded PowerPlay alternate icons (review only)
on:
  push:
    branches:
      - 'branding/powerplay-v2.0.0-review'
    paths:
      - '.github/workflows/powerplay-refresh-icons.yml'
      - 'scripts/branding/refresh_alternate_icons.py'
      - 'assets/brand/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    if: github.ref == 'refs/heads/branding/powerplay-v2.0.0-review'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin imagemagick webp
          if ! command -v magick >/dev/null; then sudo ln -s "$(command -v convert)" /usr/local/bin/magick; fi
      - name: Replace original Plezy glyph in all 23 alt-icon masters
        run: python scripts/branding/refresh_alternate_icons.py
      - name: Regenerate Android, iOS, tvOS and picker icons
        run: python scripts/codegen/generate_app_icons.py
      - name: Verify old Plezy silhouette is absent
        run: |
          ! grep -R -F 'M335.65,192.66' assets/app_icons/source
      - name: Commit to unpublished review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/app_icons android/app/src/main/res ios/Runner/AlternateAppIcons.xcassets tvos/Runner/AlternateAppIcons.xcassets
          git add android/app/src/main/AndroidManifest.xml tvos/Runner/Info.plist
          if ! git diff --cached --quiet; then
            git commit -m "brand: replace Plezy art across 23 PowerPlay icon styles"
            git push origin HEAD:branding/powerplay-v2.0.0-review
          fi
