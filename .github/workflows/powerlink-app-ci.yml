name: PowerLink Fire TV Client Tests
on:
  push:
    branches:
      - 'feature/powerlink-v1.3.0-app'
    paths:
      - 'lib/services/powerlink/**'
      - 'lib/services/powershuffle/**'
      - 'lib/screens/media_detail/**'
      - 'lib/screens/media_detail_screen.dart'
      - 'lib/services/deep_links/**'
      - 'lib/providers/playback_state_provider.dart'
      - 'lib/services/playback_coordinator.dart'
      - 'lib/screens/video_player_screen.dart'
      - 'lib/screens/video_player/parts/**'
      - 'lib/screens/video_player/wakelock_controller.dart'
      - 'test/screens/video_player/wakelock_controller_test.dart'
      - 'lib/screens/settings/powerlink_settings_screen.dart'
      - 'lib/screens/settings/settings_screen.dart'
      - 'lib/widgets/video_controls/**'
      - 'test/services/powershuffle/**'
      - 'pubspec.yaml'
      - 'test/services/powerlink/**'
      - 'test/screens/settings/powerlink_settings_screen_test.dart'
      - '.github/workflows/powerlink-app-ci.yml'
  pull_request:
    paths:
      - 'lib/services/powerlink/**'
      - 'lib/services/powershuffle/**'
      - 'lib/screens/media_detail/**'
      - 'lib/screens/media_detail_screen.dart'
      - 'lib/services/deep_links/**'
      - 'lib/providers/playback_state_provider.dart'
      - 'lib/services/playback_coordinator.dart'
      - 'lib/screens/video_player_screen.dart'
      - 'lib/screens/video_player/parts/**'
      - 'lib/screens/video_player/wakelock_controller.dart'
      - 'test/screens/video_player/wakelock_controller_test.dart'
      - 'lib/screens/settings/powerlink_settings_screen.dart'
      - 'lib/screens/settings/settings_screen.dart'
      - 'lib/widgets/video_controls/**'
      - 'test/services/powershuffle/**'
      - 'pubspec.yaml'
      - 'test/services/powerlink/**'
      - 'test/screens/settings/powerlink_settings_screen_test.dart'
      - '.github/workflows/powerlink-app-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dart-powerlink:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Resolve canonical PowerPlay source
        run: flutter pub get
      - name: Show dependency lock changes requiring a source commit
        run: git diff -- pubspec.lock
      - name: Verify PowerLink receiver, active destination takeover and deep links
        run: flutter test test/services/powerlink/powerlink_transfer_test.dart test/services/powerlink/powerlink_destination_takeover_test.dart test/services/deep_links/deep_link_test.dart test/services/playback_coordinator_test.dart test/services/powerlink/powerlink_app_client_test.dart
      - name: Check native Fire TV keyboard and D-pad pairing navigation
        run: flutter test test/screens/settings/powerlink_settings_screen_test.dart
      - name: Keep destination awake during PowerLink startup
        run: flutter test test/screens/video_player/wakelock_controller_test.dart
      - name: Verify PowerLink picker TV focus and destination selection
        run: flutter test test/services/powerlink/powerlink_handoff_picker_test.dart
      - name: Protect existing playback queue and video-start logic
        run: flutter test test/providers/playback_state_provider_test.dart
      - name: Verify PowerShuffle Fire TV D-pad focus, Back behavior and narrow-screen layout
        run: flutter test test/services/powershuffle/powershuffle_skip_dialog_test.dart test/services/powershuffle/powershuffle_event_journal_test.dart

      - name: Analyze PowerLink, source capture and player integration
        run: |
          flutter analyze --no-pub \
            lib/services/powerlink \
            lib/services/powershuffle \
            test/services/powershuffle \
            lib/screens/media_detail_screen.dart \
            lib/screens/media_detail/action_buttons.dart \
            lib/services/deep_links/deep_link.dart \
            lib/services/deep_links/deep_link_launcher.dart \
            lib/services/playback_coordinator.dart \
            lib/providers/playback_state_provider.dart \
            lib/screens/video_player_screen.dart \
            lib/screens/video_player/wakelock_controller.dart \
            test/screens/video_player/wakelock_controller_test.dart \
            lib/screens/video_player/parts/episode_navigation.dart \
            lib/screens/settings/powerlink_settings_screen.dart \
            lib/screens/settings/settings_screen.dart \
            lib/widgets/video_controls \
            lib/screens/video_player/parts/build.dart \
            test/services/powerlink \
            test/screens/settings/powerlink_settings_screen_test.dart

