name: Generate PowerPlay v2.0.0 branding assets (review branch)
on:
  push:
    branches:
      - 'branding/powerplay-v2.0.0'
    paths:
      - 'branding/**'
      - 'scripts/branding/**'
      - '.github/workflows/powerplay-brand-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    if: github.ref == 'refs/heads/branding/powerplay-v2.0.0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install 'cairosvg>=2.7,<3' 'Pillow>=11,<13'
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin imagemagick webp
          if ! command -v magick >/dev/null; then sudo ln -s "$(command -v convert)" /usr/local/bin/magick; fi
      - name: Render primary PowerPlay artwork and all alternate source glyphs
        run: python scripts/branding/render_powerplay_brand.py
      - name: Regenerate iOS, tvOS, Android, and Flutter-picker alternate icon binaries
        run: python scripts/codegen/generate_app_icons.py
      - name: Commit generated binaries only to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets docs/artwork android/app/src/main/res ios/Runner/Assets.xcassets macos/Runner/Assets.xcassets tvos/Runner/Assets.xcassets windows/runner/resources
          git add android/app/src/main/AndroidManifest.xml tvos/Runner/Info.plist
          if ! git diff --cached --quiet; then
            git commit -m "brand: regenerate complete PowerPlay icons for supported platforms"
            git push origin HEAD:branding/powerplay-v2.0.0
          fi
