name: Publish PowerPlay stable release
run-name: Publish PowerPlay ${{ inputs.release_version || 'requested stable release' }} as Latest

# Promote a verified candidate without recompiling it.
on:
  push:
    branches:
      - main
    paths:
      - '.github/powerplay/publication-request.json'
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Successful PowerPlay candidate Actions run ID'
        required: true
        type: string
      release_version:
        description: 'Stable version: patch +0.0.1 for a feature; minor +0.1.0 for a full batch'
        required: true
        type: string
        default: '1.3.0'
      confirm:
        description: 'Type PUBLISH_POWERPLAY to publish the candidate as the Latest stable release'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: powerplay-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || inputs.confirm == 'PUBLISH_POWERPLAY'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Checkout committed publication request
        if: github.event_name == 'push'
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Load explicit committed publication request
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          request=json.loads(Path('.github/powerplay/publication-request.json').read_text())
          assert request['confirm']=='PUBLISH_POWERPLAY'
          assert re.fullmatch(r'[0-9]+', str(request['candidate_run_id']))
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', request['release_version'])
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f"CANDIDATE_RUN_ID={request['candidate_run_id']}\n")
              out.write(f"RELEASE_VERSION={request['release_version']}\n")
          PYTHON
      - name: Verify successful candidate provenance
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid run ID'; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid stable version'; exit 1; }
          echo "RELEASE_TAG=powerplay-v$RELEASE_VERSION" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > /tmp/powerplay-candidate.json
          jq -e --arg prefix "release/powerplay-v$RELEASE_VERSION-rc" '
            .status=="completed" and
            .conclusion=="success" and
            (.head_branch | startswith($prefix)) and
            .path==".github/workflows/powerplay-release-candidate.yml"
          ' /tmp/powerplay-candidate.json
          SOURCE_SHA="$(jq -r '.head_sha' /tmp/powerplay-candidate.json)"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "Promoting candidate run $CANDIDATE_RUN_ID at source $SOURCE_SHA"
      - name: Download and verify the matching APK and corresponding sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate release
          gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "PowerPlay-v$RELEASE_VERSION-rc1-Candidate" --dir candidate
          cd candidate
          for suffix in .apk -Source.tar.gz -NativeSourceInputs.zip; do
            test -s "PowerPlay-v$RELEASE_VERSION-rc1$suffix"
          done
          sha256sum -c "PowerPlay-v$RELEASE_VERSION-rc1.apk.sha256"
          sha256sum -c sources.sha256
          python3 - <<'PY'
          import json, os, tarfile
          from pathlib import Path
          data=json.loads(Path('release-manifest.json').read_text())
          assert data['version']==os.environ['RELEASE_VERSION']
          assert data['source_sha']==os.environ['SOURCE_SHA']
          assert type(data['build_number']) is int
          with tarfile.open(f"PowerPlay-v{data['version']}-rc1-Source.tar.gz") as archive:
              names=set(archive.getnames())
              for path in ['LICENSE', 'POWERPLAY-RELEASE-NOTICE.md', 'assets/powerplay.png']:
                  assert f'powerplay-source/{path}' in names, path
              pubspec=archive.extractfile('powerplay-source/pubspec.yaml').read().decode()
              assert f"version: {data['version']}+{data['build_number']}\n" in pubspec
              # Release notes are version-scoped and part of the exact
              # source commit used to compile the signed candidate.
              notes_name=f"powerplay-source/.github/powerplay/release-notes/v{data['version']}.md"
              assert notes_name in names, 'missing release-specific notes'
              notes=archive.extractfile(notes_name).read().decode('utf-8')
              assert notes.startswith(f"# PowerPlay v{data['version']} — Fire TV\n")
              assert "## Changes in this release\n" in notes
              assert "## Download and source\n" in notes
              assert "## Build and attribution\n" in notes
              assert notes.count('{{CANDIDATE_RUN_ID}}') == 2
              assert notes.count('{{SOURCE_SHA}}') == 1
              assert "Since v1." not in notes, 'do not repeat prior release changelogs'
              rendered=notes.replace('{{CANDIDATE_RUN_ID}}',os.environ['CANDIDATE_RUN_ID'])
              rendered=rendered.replace('{{SOURCE_SHA}}',os.environ['SOURCE_SHA'])
              assert '{{' not in rendered and '}}' not in rendered
              Path('../release/RELEASE_NOTES.md').write_text(rendered,encoding='utf-8')
          PY
          unzip -tq "PowerPlay-v$RELEASE_VERSION-rc1-NativeSourceInputs.zip" >/dev/null
          grep -q "name='com.power.powerplay'" apk-badging.txt
          grep -q "versionName='$RELEASE_VERSION'" apk-badging.txt
          grep -q '^PowerPlay Release Candidate' BUILD-STATUS.txt
          for suffix in .apk -Source.tar.gz -NativeSourceInputs.zip; do
            cp "PowerPlay-v$RELEASE_VERSION-rc1$suffix" "../release/PowerPlay-v$RELEASE_VERSION$suffix"
          done
          cd ../release
          sha256sum "PowerPlay-v$RELEASE_VERSION.apk" \
            "PowerPlay-v$RELEASE_VERSION-Source.tar.gz" \
            "PowerPlay-v$RELEASE_VERSION-NativeSourceInputs.zip" > SHA256SUMS.txt
      - name: Publish stable release as Latest with source and checksums
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists, refusing overwrite: $RELEASE_TAG"; exit 1
          fi
          # Notes come from this candidate's reviewed, version-specific
          # source file, not a running history of previous PowerPlay updates.
          test -s release/RELEASE_NOTES.md
          gh release create "$RELEASE_TAG" \
            "release/PowerPlay-v$RELEASE_VERSION.apk" \
            "release/PowerPlay-v$RELEASE_VERSION-Source.tar.gz" \
            "release/PowerPlay-v$RELEASE_VERSION-NativeSourceInputs.zip" \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --latest \
            --title "PowerPlay v$RELEASE_VERSION — Fire TV" \
            --notes-file release/RELEASE_NOTES.md
          LATEST_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          [[ "$LATEST_TAG" == "$RELEASE_TAG" ]] || { echo "Latest release mismatch: $LATEST_TAG"; exit 1; }
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets \
            --jq '{url:.url,assets:[.assets[].name]}'
