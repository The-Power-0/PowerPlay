name: PowerPlay Pro Logic I - Private Fire TV Test
run-name: Pro Logic test APK - ${{ github.ref_name }} - ${{ github.run_number }}

# Deliberately NOT a public release workflow. A separate package ID protects
# installed PowerPlay and all Home Assistant/PowerLink automations.
on:
  push:
    branches:
      - feature/pro-logic-i-matrix-test
      - feature/prologic-overlay-diagnostics
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prologic-private-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-apk:
    name: Validate and build isolated Fire TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout exact feature source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format changed Dart sources in the build checkout
        run: |
          dart format \
            lib/screens/settings/pro_logic_speaker_test_screen.dart \
            lib/screens/settings/playback_settings_screen.dart \
            lib/mpv/player/platform/player_android.dart \
            lib/screens/video_player_screen.dart \
            lib/services/settings_service.dart \
            lib/widgets/video_controls/widgets/performance_overlay/performance_overlay.dart \
            lib/widgets/video_controls/widgets/performance_overlay/performance_stats.dart \
            lib/widgets/video_controls/widgets/performance_overlay/performance_stats_service.dart \
            test/widgets/video_controls/performance_stats_prologic_test.dart
      - name: Analyze changed Flutter UI and settings
        run: |
          flutter analyze --no-pub --no-fatal-infos \
            lib/screens/settings/pro_logic_speaker_test_screen.dart \
            lib/screens/settings/playback_settings_screen.dart \
            lib/mpv/player/platform/player_android.dart \
            lib/screens/video_player_screen.dart \
            lib/services/settings_service.dart
      - name: Run settings and audio-overlay regression tests
        run: |
          flutter test test/services/settings_service_test.dart
          flutter test test/widgets/video_controls/performance_stats_prologic_test.dart
      - name: Configure Android local properties
        run: printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" > android/local.properties
      - name: Run focused Media3 JVM audio tests
        working-directory: android
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.edde746.plezy.exoplayer.ProLogicMatrixEncoderTest' \
            --tests 'com.edde746.plezy.exoplayer.ProLogicAudioProcessorTest' \
            --tests 'com.edde746.plezy.exoplayer.DownmixMatricesTest' \
            -x :app:compileFlutterBuildDebug
      - name: Isolate candidate package from production PowerPlay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          old = 'applicationId = "com.power.powerplay"'
          assert text.count(old) == 1
          gradle.write_text(text.replace(old, 'applicationId = "com.power.powerplay.prologictest"'))
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          old = 'android:label="PowerPlay"'
          assert text.count(old) == 1
          text = text.replace(old, 'android:label="PowerPlay Pro Logic Test"')
          # Android content-provider authorities must not collide with
          # installed production PowerPlay; otherwise Android rejects install.
          text = text.replace('android:authorities="com.power.powerplay.',
                              'android:authorities="com.power.powerplay.prologictest.')
          assert text.count('com.power.powerplay.prologictest.') >= 2
          # This test app must not intercept the production PowerPlay URI.
          text = text.replace('android:scheme="powerplay"', 'android:scheme="powerplay-prologictest"')
          manifest.write_text(text)
          PY
      - name: Configure existing test signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.PLEZY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo "Existing signing secret missing"; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/powerplay-prologic.keystore"
          chmod 600 "$HOME/.android/powerplay-prologic.keystore"
          cat > android/key.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=$HOME/.android/powerplay-prologic.keystore
          EOF
          chmod 600 android/key.properties
      - name: Build Fire TV armv7 AOT APK, no release publishing
        run: |
          flutter build apk --release --target-platform android-arm --split-per-abi \
            --dart-define=PLEZY_FIRETV_PLEX_ONLY=true \
            --dart-define=PLEZY_FIRETV_FORCE_EXO_VIDEO=true \
            --dart-define=PLEZY_FIRETV_MOVIES_TV_ONLY=true \
            --dart-define=PLEZY_FIRETV_NO_EXTERNAL_SERVICES=true \
            --dart-define=PLEZY_FIRETV_NO_WATCH_TOGETHER=true \
            --dart-define=PLEZY_FIRETV_NO_COMPANION_REMOTE=true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk PowerPlay-ProLogic-Overlay-Test.apk
          test -s PowerPlay-ProLogic-Overlay-Test.apk
          sha256sum PowerPlay-ProLogic-Overlay-Test.apk > PowerPlay-ProLogic-Overlay-Test.apk.sha256
      - name: Store APK for manual Fire TV validation only
        uses: actions/upload-artifact@v4
        with:
          name: PowerPlay-ProLogic-Overlay-Test
          path: |
            PowerPlay-ProLogic-Overlay-Test.apk
            PowerPlay-ProLogic-Overlay-Test.apk.sha256
          retention-days: 14
          if-no-files-found: error
